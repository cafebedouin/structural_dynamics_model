<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A two-by-two grid. Rows are material versus formal ground. Columns are cardinality equal to one versus cardinality of one or more. All four cells name a coherent, occupied position, showing the two dimensions vary independently.</desc>

