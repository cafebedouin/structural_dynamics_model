[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-dynamics-model"
version = "0.1.0"
description = "Dependency-aware pipeline for structural dynamics analysis"
authors = [
    {name = "cafebedouin", email = "cafebedouin@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
stats = [
    "scipy",
    "scikit-learn",
    "statsmodels",
]
ai = [
    "google-genai",
    "anthropic",
]

# This repo is a collection of scripts run as `python3 python/foo.py`,
# not an importable package. Declaring no packages/modules disables
# setuptools' flat-layout auto-discovery, which otherwise tries to
# package every top-level data directory (json/, blog/, outputs/, ...).
[tool.setuptools]
packages = []
py-modules = []
